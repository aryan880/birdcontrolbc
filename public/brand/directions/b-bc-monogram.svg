    <g transform="translate(40 78) scale(.31)" color="#102F28"><use href="#mark-b"/></g>
    <text x="110" y="110" fill="#102F28" font-family="Arial, sans-serif" font-size="20" font-weight="800">Bird Control BC</text>
    <text x="112" y="130" fill="#667451" font-family="Arial, sans-serif" font-size="6.5" font-weight="700" letter-spacing="2">VANCOUVER · LOWER MAINLAND</text>
    <text x="291" y="114" fill="#102F28" font-family="Arial, sans-serif" font-size="10" font-weight="700">Services</text>
    <text x="350" y="114" fill="#102F28" font-family="Arial, sans-serif" font-size="10" font-weight="700">Projects</text>
    <rect x="414" y="92" width="64" height="38" rx="4" fill="#102F28"/>
    <text x="446" y="115" text-anchor="middle" fill="#F6F1E7" font-family="Arial, sans-serif" font-size="8" font-weight="700">Quote</text>
    <text x="24" y="207" fill="#102F28" font-family="Georgia, serif" font-size="24" font-weight="700">Why it works</text>
    <text x="24" y="244" fill="#5E6A64" font-family="Arial, sans-serif" font-size="14">The B and C share one compact footprint. The bird</text>
    <text x="24" y="268" fill="#5E6A64" font-family="Arial, sans-serif" font-size="14">interrupts the upper counter while three exclusion lines</text>
    <text x="24" y="292" fill="#5E6A64" font-family="Arial, sans-serif" font-size="14">anchor the mark to the service rather than general wildlife.</text>
    <text x="24" y="329" fill="#667451" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">STRONGEST SMALL-SIZE RECOGNITION</text>
