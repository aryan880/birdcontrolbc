    <text x="259" y="366" text-anchor="middle" fill="#667451" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="3.5">VANCOUVER · LOWER MAINLAND</text>
    <line x1="100" y1="405" x2="418" y2="405" stroke="#D8DAD4"/>
    <text x="259" y="443" text-anchor="middle" fill="#68736D" font-family="Arial, sans-serif" font-size="14">Compact and highly ownable.</text>
